# Next.js app (medjat_central_web) — app.medjatapp.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.permedjat.com;
    ssl_certificate     /etc/ssl/certs/combined-origin.pem;
    ssl_certificate_key /etc/ssl/private/combined-origin.key;
    client_max_body_size 25m;

    location / {
        # Coarse flood protection on the real client address (see
        # conf.d/medjat-web-zone.conf for why this lives here and not in PHP).
        limit_req zone=medjat_web burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# Promo / landing site — medjatapp.com + www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name permedjat.com www.permedjat.com;
    ssl_certificate     /etc/ssl/certs/combined-origin.pem;
    ssl_certificate_key /etc/ssl/private/combined-origin.key;

    root /var/www/permedjat-web/promo;
    index index.html;

    # App/Universal-link association files. Served by the application's
    # .well-known route, which returns the employee pair for this host and the
    # management pair for api.permedjat.com.
    location = /.well-known/apple-app-site-association {
        include snippets/permedjat-laravel-front.conf;
    }
    location = /.well-known/assetlinks.json {
        include snippets/permedjat-laravel-front.conf;
    }

    # The join landing pages, shown when a link is opened where the app is not
    # installed. No join.css location any more: these views inline their CSS, so
    # the stylesheet the old backend served separately has nothing left to serve.
    location = /join {
        include snippets/permedjat-laravel-front.conf;
    }
    location = /join_team {
        include snippets/permedjat-laravel-front.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
