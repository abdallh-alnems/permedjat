# Shared body for the Medjat API server blocks (HTTP + HTTPS).
root /var/www/permedjat;
index index.php index.html;

client_max_body_size 40m;

# Security headers (mirror the old .htaccess)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# gzip
gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_types application/json application/javascript text/css text/plain text/xml image/svg+xml;

# App/Universal-link association files for the *management* app, which declares
# api.medjatapp.com. These are exact-match locations so they outrank the regex
# deny rules below — the blanket "*.json" rule would otherwise return 403 for
# assetlinks.json and silently break App Links verification.
# The employee app declares medjatapp.com and is served from the promo vhost.
# Served by the application's .well-known route, which picks the right pair from
# the host asked, rather than by aliasing files out of the old backend's tree.
# Still exact-match locations: the "*.json" and hidden-file deny rules below are
# regexes and outrank the prefix location, so assetlinks.json would be 403'd
# before it ever reached the application.
location = /.well-known/assetlinks.json {
    include snippets/permedjat-laravel-front.conf;
}
location = /.well-known/apple-app-site-association {
    include snippets/permedjat-laravel-front.conf;
}

# Deny hidden + sensitive files (precede the PHP handler)
location ~ /\.(?!well-known) { deny all; }
location ~* /(config|core|models|vendor|migrations|seeds|scripts|lang)/ { deny all; }

# Employee evidence — payslips, identity documents, face and punch captures.
# Everything under uploads/ is served only through an authenticated PHP endpoint
# (documents/view.php, payroll/get_slip_pdf.php, attendance/punch_photo.php, ...).
# ^~ also beats the \.php$ block, so an uploaded script is never executed.
location ^~ /backend_medjet/uploads/ { deny all; }
location ^~ /uploads/ { deny all; }
location ~* \.(env|log|sql|bak|inc|sh|conf|ini|dist|lock|md)$ { deny all; }
location ~* \.json$ { deny all; }

# PHP handler
location ~ \.php$ {
    try_files $uri =404;
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_read_timeout 120s;
}


# ---------------------------------------------------------------------------
# Laravel (backend/api) at the root of this host — added 2026-09-04.
#
# Mounted at / rather than under a prefix because /join, /.well-known/{file}
# and /iclock/{action} are declared outside the /v1 group and must sit at the
# root. /backend was never a real prefix on this server (it 404s); /api would be
# redundant under api.permedjat.com.
#
# The legacy backend is deliberately untouched. Every /backend_medjet/... URL
# ends in .php, so it is caught by the `~ \.php$` regex block above, and a regex
# location outranks the `location /` prefix below — legacy keeps resolving
# against the server-level root of /var/www/permedjat exactly as before.
# ---------------------------------------------------------------------------

# Exact match on purpose: it beats the `~ \.php$` regex, so Laravel's front
# controller is never resolved against the legacy docroot. Without this line the
# try_files fallback below internally redirects to /index.php, that redirect is
# re-matched against `~ \.php$`, and SCRIPT_FILENAME becomes
# /var/www/permedjat/index.php — a file that does not exist. Every Laravel route
# would 404 while every legacy URL kept working, which is the failure mode that
# looks like "the deploy did nothing".
location = /index.php {
    root /var/www/permedjat/api/public;
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_read_timeout 120s;
}

location / {
    root /var/www/permedjat/api/public;
    try_files $uri $uri/ /index.php?$query_string;
}
location = /favicon.ico { root /var/www/permedjat/api/public; access_log off; log_not_found off; }
location = /robots.txt  { root /var/www/permedjat/api/public; access_log off; log_not_found off; }

# The terminal protocol belongs to the devices vhost on :8090 and nowhere else.
# Mounting the application at this root made /iclock/ reachable through
# Cloudflare too, where an unknown serial auto-inserts an unclaimed device row.
location ^~ /iclock/ { deny all; }
