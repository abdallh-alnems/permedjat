# Hand this request to the Laravel front controller, whatever its URI.
#
# Used by the exact-match locations that cannot simply fall through to
# `location /`: on the API vhost the `*.json` and hidden-file deny rules are
# regexes and would 403 assetlinks.json first, and on the promo and device
# vhosts the application is not the docroot at all.
#
# REQUEST_URI is left untouched, so the routing decision stays in the
# application rather than being duplicated in nginx.
fastcgi_pass unix:/run/php/php8.5-fpm.sock;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/permedjat/api/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/permedjat/api/public;
fastcgi_param HTTP_AUTHORIZATION $http_authorization;
fastcgi_param HTTPS $https if_not_empty;
fastcgi_read_timeout 120s;
